server {
    server_name okemily.com www.okemily.com;

    root /var/www/okemily;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Prompt-o-verse gallery: force revalidation on every load (added by
    # sudo-queue/16-prompt-o-verse-nocache.sh) -- the page polls
    # /api/v1/promptoverse/nodes and patches itself live, but with no
    # Cache-Control at all a browser could otherwise keep serving an old
    # cached snapshot of the page indefinitely (RFC 7234 heuristic
    # freshness), silently defeating the live-reload feature for anyone
    # who loaded it before this location block existed.
    location /prompt-o-verse/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # IDUNA API proxy (added 2026-07-18) — same-origin path for the
    # mailing-list signup form, so the browser never has to make a
    # cross-origin request to iduna.farthq.com (which has no HTTPS cert as
    # of this writing — see EMILY docs/hq-specs/HQ-SPEC-INFRA-105 S151-04).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # IDUNA admin login (added 2026-07-19) — same-origin proxy so
    # /admin/login works over okemily.com's real HTTPS cert without
    # depending on iduna.farthq.com's cert (still pending) or its
    # WordPress/EDIS root-path collision (unresolved, see
    # EMILY/docs/fable-prompts/iduna-front-door-funnel.md). Admin auth is
    # cookie-based (RequireCookieAuth) — proxying same-origin keeps that
    # simple; no cross-origin cookie handling needed.
    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Developer notebook portal (added 2026-08-25) — same same-origin-proxy
    # reasoning as /admin/ above (cookie-based RequireCookieAuth, real HTTPS
    # cert, no cross-origin cookie handling). Gated behind devportal.access
    # (see IDUNA migration 202608250001_devportal_permissions.sql) — granted
    # to nobody by default, so exposing the login link here does not expose
    # the portal itself.
    location /portal {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JEWEL -- real PARENA Jupyter kernel/backend (added 2026-08-26, founder:
    # "work on our parena JUPYTER backend just use basic auth to protect it
    # for now until we get google oauthg to work" -> "call it JEWEL"). Proxies
    # to the fatbaby-broker (127.0.0.1:8679, user systemd, no sudo to
    # redeploy -- see PRRJECT_FATBABY/ops/systemd/fatbaby-broker.service),
    # NOT directly to JupyterLab (127.0.0.1:8890) -- founder, real-time:
    # "set up a single nginx proxy" -> "use fatbaby proxy broker to manage
    # proxies instead of always asking for a new feature". The broker's own
    # config-driven routing (gpt2-alpine-c/config/broker-routes.json,
    # path_prefix "/jewel/") does the real HTTP Basic Auth gating (bcrypt,
    # see broker/middleware.go's checkBasicAuth) and real WebSocket
    # proxying (broker/proxy.go's handleUpgrade, needed since the real
    # Jupyter kernel protocol runs over a websocket) -- this location block
    # only needs to blindly forward, including the upgrade headers, to the
    # broker. Adding the NEXT broker-routed service needs no nginx/sudo
    # change at all, just a new route in broker-routes.json (a SIGHUP or
    # restart of fatbaby-broker.service, both no-sudo) -- that's the whole
    # point of routing through the broker instead of nginx auth_basic
    # directly, which needed a new sudo-gated edit per service.
    location /jewel/ {
        proxy_pass http://127.0.0.1:8679;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SARENA_NOTEBOOK (added 2026-08-28) -- real custom PARENA notebook frontend
    # (docs/NORTHSTAR_SARENA_NOTEBOOK.md, JEWEL repo), same real broker-fronted shape
    # /jewel/ just above already establishes -- routed by path_prefix inside the SAME
    # broker (gpt2-alpine-c/config/broker-routes.json's "sarena-notebook" route), not a
    # second broker instance. No proxy_read_timeout override needed here (static files
    # only -- the notebook's own real-time kernel traffic goes to /jewel/ directly).
    location /sarena/ {
        proxy_pass http://127.0.0.1:8679;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FatBaby newssite (updated 2026-07-18) — moved to its own subdomain
    # (news.okemily.com) since newssite generates root-relative links
    # (/tickers, /section/...) with no base-path config option; those broke
    # under this subpath proxy (ticker sub-pages 404'd). Redirect instead
    # of proxying here.
    location /news/ {
        rewrite ^/news/(.*)$ https://news.okemily.com/$1 permanent;
    }
    location = /news {
        return 301 https://news.okemily.com/;
    }

    # GFD Battlegrounds WebSocket<->UDP relay (added 2026-08-20, founder:
    # "ensure GFD web is live on okemily - link it from WOTAN" / "live demos
    # that are more than just demos"). okemily.com is HTTPS-only, so a
    # browser refuses any *insecure* ws:// connection the WASM client tries
    # to open (mixed-active-content blocking) — this terminates TLS here
    # (real wss://, same cert as the rest of the site) and proxies the
    # WebSocket upgrade to gfd-wsudprelay (GoblinFoxDragon/apps2/wsudprelay),
    # which does the actual ws<->UDP bridging to the real REDGARDEN backend
    # (redgarden-stable) over plain ws:// on loopback only. The port capture
    # is deliberately bounded to exactly gfd-wsudprelay's own listener range
    # (matchmaker 8778, game ports 8300-8399) — not an open arbitrary-port
    # proxy. apps2/battlegrounds_gui/wasm/websocket_proxy_pre.js is the
    # client-side half (Module.websocket.url = 'wss://okemily.com/gfd-ws/{port}').
    location ~ "^/gfd-ws/(?<wsport>8778|83[0-9]{2})$" {
        proxy_pass http://127.0.0.1:$wsport;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/okemily.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/okemily.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



    add_header Strict-Transport-Security "max-age=31536000" always; # managed by Certbot

}
server {
    if ($host = www.okemily.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = okemily.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


