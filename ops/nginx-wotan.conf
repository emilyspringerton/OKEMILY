# nginx server block for wotan.okemily.com (2026-07-29). DNS already exists (founder-provisioned,
# resolves to this box). Serves the SAME static root as okemily.com (/var/www/okemily) -- no
# separate deploy path, no file duplication -- just with tournaments.html (the existing WOTAN
# brand page, S169-05's own "okemily.com/tournaments.html already covers it" precedent) as the
# default index instead of the main landing page's own index.html. tournaments.html keeps
# working at its original okemily.com/tournaments.html URL too; this is purely an additional
# way to reach the exact same file, not a move.
#
# NOT YET LIVE as of this commit -- installing this file (copy to
# /etc/nginx/sites-available/wotan, symlink into sites-enabled/, `sudo nginx -t && sudo systemctl
# reload nginx`) and provisioning the TLS cert (`sudo certbot --nginx -d wotan.okemily.com`) both
# need interactive sudo, which Claude Code cannot complete unattended in this environment -- see
# this repo's own CLAUDE.md "Deploy" section for the full reasoning (also: certbot's own
# --nginx run REWRITES this file in place to add the SSL/443 block; don't hand-copy an https-only
# version of this file over whatever certbot produces).
server {
    server_name wotan.okemily.com;

    root /var/www/okemily;
    index tournaments.html;

    location / {
        try_files $uri $uri/ /tournaments.html;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Same same-origin IDUNA API proxy as okemily.com's own vhost (ops/nginx-okemily.conf) --
    # tournaments.html's own leaderboard/hero-stats fetch() calls need this regardless of which
    # domain served the page.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
    # 443/SSL block intentionally omitted -- certbot's own --nginx run adds it (and the
    # HTTP->HTTPS redirect, and HSTS) automatically, matching every other vhost in this repo.
    # Do not hand-write one; see this file's own header comment.
}
