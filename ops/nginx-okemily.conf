    }

    # GFD Battlegrounds WebSocket<->UDP relay — see the matching block in
    # the :443 server above for the full doc comment. Duplicated here only
    # for consistency with every other location block in this file (this
    # :80 server's own certbot-managed if-blocks redirect to HTTPS before
    # location matching ever runs, same as the rest of this stanza).
    location ~ "^/gfd-ws/(?<wsport>8778|83[0-9]{2})$" {
        proxy_pass http://127.0.0.1:$wsport;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }




}
