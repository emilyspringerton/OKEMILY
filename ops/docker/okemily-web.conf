# okemily.com static site. Git-tracked files are baked into this image (/usr/share/nginx/html);
# anything IDUNA renders live -- blog/, tyler/, prompt-o-verse/, battlegrounds/, blog-manifest.txt, design/ --
# is NOT in git and lives on IDUNA's PVC, mounted read-write at /app/var/www in the same pod. Image
# files win, PVC is the fallback, so a stale PVC copy of a git-tracked page can never shadow a deploy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ @pvc; }
    location /prompt-o-verse/ { add_header Cache-Control "no-cache"; root /app/var/www; try_files $uri $uri/ =404; }
    location @pvc { root /app/var/www; try_files $uri $uri/ =404; }
}
